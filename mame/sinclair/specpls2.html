<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>ZX Spectrum +2</title>
    <base href="../../">
  </head>
  <body>
    <div id="app"></div>

    <script type="text/javascript" src="mame-loader.js"></script>
    <script type="text/javascript" src="theme-simple.js"></script>
    <script type="text/javascript">
      MAMEThemeSimple.mount(document.getElementById("app"), {
        driver:  "specpls2",
        files: [
          { url: "roms/specpls2.zip",   path: "roms/specpls2.zip" },
        ],
        args: [
          "-window", "-video", "bgfx", "-bgfx_screen_chains", "unfiltered",
          "-nokeepaspect", // square pixels: content 352x296, 704x592 = 2x2
          "-resolution", "704x592",
        ],
      });
    </script>
  </body>
</html>
