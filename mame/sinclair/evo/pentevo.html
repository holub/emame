<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Pentevo</title>
    <base href="../../../">
  </head>
  <body>
    <div id="app"></div>

    <script type="text/javascript" src="mame-loader.js"></script>
    <script type="text/javascript" src="theme-simple.js"></script>
    <script type="text/javascript">
      MAMEThemeSimple.mount(document.getElementById("app"), {
        driver:  "pentevo",
        files: [
          { url: "cfg/pentevo.cfg",        path: "cfg/pentevo.cfg" },
          { url: "nvram/pentevo/glukrs",   path: "nvram/pentevo/glukrs" },
          { url: "roms/pentevo.zip",       path: "roms/pentevo.zip" },
          { url: "roms/betadisk.zip",      path: "roms/betadisk.zip" },
          { url: "roms/zxbus_neogs.zip",   path: "roms/zxbus_neogs.zip" },
          { url: "roms/kb_ms_natural.zip", path: "roms/kb_ms_natural.zip" },
          { url: "software/MCXVIEW.TRD",   path: "MCXVIEW.TRD" },
        ],
        args: [
          "-window", "-video", "bgfx", "-bgfx_screen_chains", "unfiltered",
          "-nokeepaspect", // square pixels: content 336x272, 672x544 = 2x2
          "-resolution", "672x544",
          "-zxbus1", "neogs",
          "-flop1", "MCXVIEW.TRD"
        ],
        nmi: true,
      });
    </script>
  </body>
</html>
