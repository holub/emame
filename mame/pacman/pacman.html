<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Pac-Man</title>
    <base href="../../">
  </head>
  <body>
    <div id="app"></div>

    <script type="text/javascript" src="mame-loader.js"></script>
    <script type="text/javascript" src="theme-simple.js"></script>
    <script type="text/javascript">
      MAMEThemeSimple.mount(document.getElementById("app"), {
        driver:  "pacman",
        files: [
          { url: "roms/pacman.zip", path: "roms/pacman.zip" },
          { url: "roms/puckman.zip", path: "roms/puckman.zip" },
        ],
        args: [
          "-window", "-video", "bgfx", "-bgfx_screen_chains", "unfiltered",
          "-nokeepaspect",
          "-resolution", "576x896", //base: 288x448
        ],
      });
    </script>
  </body>
</html>
